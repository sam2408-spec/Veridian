<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>Zaytoun School · مدرسة الزيتون</title>
<meta name="description" content="A free, Arabic-first learning page for children of Gaza and every child affected by war. Works offline.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c6a2b">
<link rel="manifest" href="/school/manifest.webmanifest">
<link rel="icon" href="/school/icon.svg" type="image/svg+xml">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow column, phone first; big tap tiles; no web fonts so the page stays tiny on weak connections */
:root{
  --bg:#f1f5ec; --surface:#ffffff; --ink:#1d2a1a; --muted:#56664f;
  --olive:#4c6a2b; --olive-soft:#dfe8d2; --sky:#2a73a8; --sky-soft:#dcebf5;
  --sun:#e9a92c; --sun-soft:#fbeccb; --good:#2f7d3a; --bad:#b4432f; --line:#d3dcc9;
  --f-ar:"Noto Naskh Arabic","Geeza Pro","Segoe UI","Tahoma",sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a12; --surface:#1e261b; --ink:#e7eee0; --muted:#a3b39a;
  --olive:#9cc06a; --olive-soft:#2b3a22; --sky:#7cb9e4; --sky-soft:#1d3142;
  --sun:#f0c060; --sun-soft:#3a3018; --good:#7fcf88; --bad:#f08a76; --line:#33402d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a12; --surface:#1e261b; --ink:#e7eee0; --muted:#a3b39a;
  --olive:#9cc06a; --olive-soft:#2b3a22; --sky:#7cb9e4; --sky-soft:#1d3142;
  --sun:#f0c060; --sun-soft:#3a3018; --good:#7fcf88; --bad:#f08a76; --line:#33402d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.55}
[dir="rtl"] body, html[dir="rtl"]{font-family:var(--f-ar)}
.wrap{max-width:620px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:44px;height:44px;border-radius:50%;background:var(--olive);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
h1{font-size:1.35rem;margin:0;line-height:1.2}
.badge{font-size:.72rem;letter-spacing:.04em;color:var(--muted)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font:inherit;font-size:.95rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--olive);color:var(--surface)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hello{background:var(--sun-soft);border-radius:18px;padding:16px 18px}
.hello p{margin:0}
.hello .big{font-size:1.3rem;font-weight:700;margin-bottom:4px;text-wrap:balance}
.stars{display:flex;align-items:center;gap:8px;font-weight:700}
.stars span{color:var(--sun);font-size:1.3rem}
h2{font-size:1.1rem;margin:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:18px;padding:16px;min-height:128px;text-align:start;cursor:pointer;color:var(--ink);
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;font:inherit}
.tile .glyph{font-size:2rem;font-weight:700;line-height:1}
.tile b{font-size:1.05rem}
.tile small{color:var(--muted);font-size:.85rem}
.t-ar{background:var(--olive-soft)} .t-ar .glyph{color:var(--olive)}
.t-math{background:var(--sky-soft)} .t-math .glyph{color:var(--sky)}
.t-en{background:var(--sun-soft)} .t-en .glyph{color:var(--sun)}
.t-calm{background:var(--surface);border:1.5px solid var(--line)} .t-calm .glyph{color:var(--olive)}
.tile[disabled]{opacity:.55;cursor:default;background:var(--surface);border:1.5px dashed var(--line)}
.panel{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px;border:1.5px solid var(--line)}
.back{align-self:flex-start;border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;direction:rtl}
.letters button{font-family:var(--f-ar);font-size:1.6rem;padding:8px 0;border:0;border-radius:12px;background:var(--olive-soft);color:var(--ink);cursor:pointer}
.letters button[aria-pressed="true"]{background:var(--olive);color:var(--surface)}
.show{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.show .huge{font-family:var(--f-ar);font-size:5rem;line-height:1.1;color:var(--olive)}
.show .word{font-family:var(--f-ar);font-size:1.8rem}
.show .pic{font-size:3rem;line-height:1}
.listen{border:0;border-radius:999px;background:var(--sky);color:var(--surface);padding:10px 20px;font:inherit;cursor:pointer}
.q{font-size:2.6rem;font-weight:700;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choices button{font:inherit;font-size:1.8rem;font-weight:700;padding:14px 0;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.choices button.ok{border-color:var(--good);color:var(--good)}
.choices button.no{border-color:var(--bad);color:var(--bad)}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;direction:ltr;min-height:28px}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--sky);display:block}
.dots i.b{background:var(--sun)}
.msg{text-align:center;min-height:1.6em;font-weight:700}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{border:0;border-radius:14px;background:var(--sun-soft);padding:12px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.card .pic{font-size:2.2rem;line-height:1.2}
.card .en{font-size:1.15rem;font-weight:700;direction:ltr}
.card .ar{font-family:var(--f-ar);color:var(--muted)}
.breath{display:grid;place-items:center;height:240px}
.circle{width:110px;height:110px;border-radius:50%;background:var(--olive-soft);border:3px solid var(--olive);display:grid;place-items:center;font-weight:700;color:var(--olive);animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.8)}}
@media (prefers-reduced-motion:reduce){.circle{animation:none}}
.calm-text{text-align:center;margin:0;text-wrap:balance}
footer{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1.5px solid var(--line);padding-top:16px}
footer p{margin:0}
footer strong{color:var(--ink)}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
var T={
 ar:{name:"مدرسة الزيتون",badge:"نسخة تجريبية",
  hello:"أهلًا بك! هذه مدرستك.",
  for:"لأطفال غزة، ولكل طفل في السودان والكونغو وسوريا ولبنان وكوبا واليمن، ولأطفال الروهينغا. مجانًا، بلا تسجيل.",
  stars:"نجومك",choose:"اختر درسًا",
  s_ar:"القراءة العربية",s_ar2:"الحروف والكلمات",
  s_math:"الحساب",s_math2:"الجمع والطرح",
  s_en:"الإنجليزية",s_en2:"كلمات أولى",
  s_calm:"ركن الهدوء",s_calm2:"تنفّس معي",
  s_sci:"العلوم",s_sci2:"قريبًا",
  back:"رجوع",listen:"استمع",tapLetter:"اضغط على حرف",
  howMany:"كم يساوي؟",ok:"أحسنت! ⭐",no:"حاول مرة أخرى",next:"سؤال جديد",
  tapWord:"اضغط على الصورة لتسمع الكلمة",
  calm1:"إذا شعرت بالخوف أو الحزن، فهذا طبيعي. أنت لست وحدك.",
  calm2:"تنفّس مع الدائرة: شهيق حين تكبر، وزفير حين تصغر.",in_:"شهيق",
  safe:"<strong>آمن للأطفال:</strong> لا محادثة مع غرباء، لا إعلانات، لا حسابات. التقدّم يُحفظ على هذا الهاتف فقط.",
  light:"<strong>خفيف:</strong> الصفحة كلها أقل من ٥٠ كيلوبايت، وتعمل على الهواتف البسيطة.",
  more:"لغات قادمة: Français · Kiswahili · Español · Ruáingga"},
 en:{name:"Zaytoun School",badge:"Preview",
  hello:"Welcome! This is your school.",
  for:"For the children of Gaza, and for every child in Sudan, Congo, Syria, Lebanon, Cuba and Yemen, and Rohingya children. Free, no sign-up.",
  stars:"Your stars",choose:"Choose a lesson",
  s_ar:"Arabic reading",s_ar2:"Letters and words",
  s_math:"Maths",s_math2:"Adding and taking away",
  s_en:"English",s_en2:"First words",
  s_calm:"Calm corner",s_calm2:"Breathe with me",
  s_sci:"Science",s_sci2:"Coming soon",
  back:"Back",listen:"Listen",tapLetter:"Tap a letter",
  howMany:"How much is it?",ok:"Well done! ⭐",no:"Try again",next:"New question",
  tapWord:"Tap a picture to hear the word",
  calm1:"If you feel scared or sad, that is okay. You are not alone.",
  calm2:"Breathe with the circle: in as it grows, out as it shrinks.",in_:"in",
  safe:"<strong>Safe for children:</strong> no chat with strangers, no ads, no accounts. Progress is saved on this phone only.",
  light:"<strong>Light:</strong> the whole page is under 50 KB and works on simple phones.",
  more:"Languages coming: Français · Kiswahili · Español · Ruáingga"}
};
var LETTERS=[["أ","أرنب","🐇"],["ب","بطة","🦆"],["ت","تفاحة","🍎"],["ث","ثعلب","🦊"],["ج","جمل","🐪"],["ح","حصان","🐎"],["خ","خروف","🐑"],["د","دب","🐻"],["ذ","ذرة","🌽"],["ر","ريح","🌬️"],["ز","زيتون","🌿"],["س","سمكة","🐟"],["ش","شمس","☀️"],["ص","صوص","🐤"],["ض","ضفدع","🐸"],["ط","طماطم","🍅"],["ظ","ظرف","✉️"],["ع","عصفور","🐦"],["غ","غيمة","☁️"],["ف","فراشة","🦋"],["ق","قمر","🌙"],["ك","كتاب","📖"],["ل","ليمون","🍋"],["م","موز","🍌"],["ن","نحلة","🐝"],["هـ","هدية","🎁"],["و","وردة","🌹"],["ي","يد","✋"]];
var WORDS=[["🍎","apple","تفاحة"],["☀️","sun","شمس"],["🌙","moon","قمر"],["🐱","cat","قطة"],["🐟","fish","سمكة"],["🌳","tree","شجرة"],["📖","book","كتاب"],["💧","water","ماء"],["🐦","bird","عصفور"],["🌸","flower","وردة"],["⭐","star","نجمة"],["🍋","lemon","ليمون"]];

function load(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S={lang:load("zs_lang","ar"),stars:load("zs_stars",0),view:"home",letter:0,q:null};
var app=document.getElementById("app");
var canSpeak=("speechSynthesis" in window);
function t(k){return T[S.lang][k]}
function num(n){return S.lang==="ar"?String(n).replace(/\d/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]}):String(n)}
function speak(text,lang){if(!canSpeak)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function newQ(){var add=Math.random()<.6,a,b,ans;
  if(add){a=1+Math.floor(Math.random()*5);b=1+Math.floor(Math.random()*4);ans=a+b}
  else{a=3+Math.floor(Math.random()*6);b=1+Math.floor(Math.random()*(a-1));ans=a-b}
  var set=[ans];while(set.length<3){var c=Math.max(0,ans+Math.floor(Math.random()*5)-2);if(set.indexOf(c)<0)set.push(c)}
  set.sort(function(){return Math.random()-.5});S.q={a:a,b:b,add:add,ans:ans,opts:set,state:null,picked:null}}

function header(){
 return '<header><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 21V9" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="8" cy="9" rx="4" ry="2" transform="rotate(-30 8 9)" fill="#fff"/><ellipse cx="16" cy="7" rx="4" ry="2" transform="rotate(30 16 7)" fill="#fff"/><ellipse cx="9" cy="14" rx="3.4" ry="1.7" transform="rotate(-25 9 14)" fill="#fff"/><circle cx="15" cy="13" r="2" fill="#fff"/></svg></div>'+
 '<div><h1>'+t("name")+'</h1><div class="badge">'+t("badge")+'</div></div></div>'+
 '<div class="lang" role="group" aria-label="Language"><button id="l-ar" data-lang="ar" aria-pressed="'+(S.lang==="ar")+'" lang="ar">العربية</button><button id="l-en" data-lang="en" aria-pressed="'+(S.lang==="en")+'" lang="en">English</button></div></header>'}

function footer(){return '<footer><p>'+t("safe")+'</p><p>'+t("light")+'</p><p>'+t("more")+'</p><p><a href="/" style="color:inherit">Veridian Academy · veridian.lk</a></p></footer>'}

function home(){
 return '<section class="hello"><p class="big">'+t("hello")+'</p><p>'+t("for")+'</p></section>'+
 '<div class="stars">'+t("stars")+': <span aria-hidden="true">★</span> '+num(S.stars)+'</div>'+
 '<h2>'+t("choose")+'</h2><div class="tiles">'+
 tile("ar","t-ar","أ ب",t("s_ar"),t("s_ar2"))+
 tile("math","t-math",S.lang==="ar"?"١+٢":"1+2",t("s_math"),t("s_math2"))+
 tile("en","t-en","ABC",t("s_en"),t("s_en2"))+
 tile("calm","t-calm","◯",t("s_calm"),t("s_calm2"))+
 '<button class="tile" disabled><span class="glyph">✦</span><span><b>'+t("s_sci")+'</b><br><small>'+t("s_sci2")+'</small></span></button></div>'}
function tile(v,c,g,a,b){return '<button class="tile '+c+'" id="go-'+v+'" data-go="'+v+'"><span class="glyph">'+g+'</span><span><b>'+a+'</b><br><small>'+b+'</small></span></button>'}

function arabic(){var L=LETTERS[S.letter];
 return panel(t("s_ar"),
 '<div class="show"><div class="huge" lang="ar">'+L[0]+'</div><div class="pic" aria-hidden="true">'+L[2]+'</div><div class="word" lang="ar">'+L[1]+'</div>'+
 (canSpeak?'<button class="listen" data-say="'+esc(L[0]+"، "+L[1])+'" data-sl="ar">'+t("listen")+'</button>':'')+'</div>'+
 '<p class="calm-text" style="color:var(--muted)">'+t("tapLetter")+'</p>'+
 '<div class="letters">'+LETTERS.map(function(x,i){return '<button data-letter="'+i+'" aria-pressed="'+(i===S.letter)+'" lang="ar">'+x[0]+'</button>'}).join("")+'</div>')}

function maths(){if(!S.q)newQ();var q=S.q,d="";
 for(var i=0;i<q.a;i++)d+='<i></i>';
 if(q.add){d+='<span style="width:10px"></span>';for(i=0;i<q.b;i++)d+='<i class="b"></i>'}
 return panel(t("s_math"),
 '<p class="calm-text">'+t("howMany")+'</p><div class="q">'+num(q.a)+(q.add?" + ":" − ")+num(q.b)+' = ?</div>'+
 '<div class="dots" aria-hidden="true">'+d+'</div>'+
 '<div class="choices">'+q.opts.map(function(o){var c=q.picked===o?(o===q.ans?"ok":"no"):"";return '<button class="'+c+'" data-ans="'+o+'">'+num(o)+'</button>'}).join("")+'</div>'+
 '<div class="msg '+(q.state||"")+'" role="status">'+(q.state==="ok"?t("ok"):q.state==="no"?t("no"):"")+'</div>'+
 (q.state==="ok"?'<button class="listen" style="align-self:center" data-next="1">'+t("next")+'</button>':''))}

function english(){return panel(t("s_en"),
 '<p class="calm-text" style="color:var(--muted)">'+t("tapWord")+'</p><div class="cards">'+
 WORDS.map(function(w){return '<button class="card" data-say="'+w[1]+'" data-sl="en-GB"><span class="pic" aria-hidden="true">'+w[0]+'</span><span class="en">'+w[1]+'</span><span class="ar" lang="ar">'+w[2]+'</span></button>'}).join("")+'</div>')}

function calm(){return panel(t("s_calm"),
 '<p class="calm-text">'+t("calm1")+'</p><div class="breath"><div class="circle">'+t("in_")+'</div></div><p class="calm-text">'+t("calm2")+'</p>')}

function panel(title,body){return '<section class="panel"><button class="back" data-go="home">'+(S.lang==="ar"?"→ ":"← ")+t("back")+'</button><h2>'+title+'</h2>'+body+'</section>'}

function render(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 var v={home:home,ar:arabic,math:maths,en:english,calm:calm}[S.view]||home;
 app.innerHTML=header()+v()+footer()}

app.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.dataset.lang){S.lang=b.dataset.lang;save("zs_lang",S.lang);render();return}
 if(b.dataset.go){S.view=b.dataset.go;if(S.view==="math")newQ();render();window.scrollTo(0,0);return}
 if(b.dataset.letter){S.letter=+b.dataset.letter;render();var L=LETTERS[S.letter];speak(L[0]+"، "+L[1],"ar");return}
 if(b.dataset.say){speak(b.dataset.say,b.dataset.sl);return}
 if(b.dataset.ans!==undefined&&S.q&&S.q.state!=="ok"){var o=+b.dataset.ans;S.q.picked=o;
   if(o===S.q.ans){S.q.state="ok";S.stars++;save("zs_stars",S.stars)}else S.q.state="no";render();return}
 if(b.dataset.next){newQ();render()}
});
render();
})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){navigator.serviceWorker.register("/school-sw.js",{scope:"/school"}).catch(function(){})}
</script>
</body>
</html>
