<!doctype html>
<html lang="ar" dir="rtl">
<head>
<title>Zaytoun School · مدرسة الزيتون</title>
<meta name="description" content="A free, Arabic-first learning and play space for children of Gaza and every child affected by war. Songs, lessons, drawing, colouring, games and stories. Works offline.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4c6a2b">
<link rel="manifest" href="/school/manifest.webmanifest">
<link rel="icon" href="/school/icon.svg" type="image/svg+xml">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<style>
/* One narrow column, phone first; big tap targets; no web fonts, no images, no outside requests, so it stays tiny and works offline */
:root{
  --bg:#f1f5ec; --surface:#ffffff; --ink:#1d2a1a; --muted:#56664f;
  --olive:#4c6a2b; --olive-soft:#dfe8d2; --sky:#2a73a8; --sky-soft:#dcebf5;
  --sun:#e9a92c; --sun-soft:#fbeccb; --rose:#c2546f; --rose-soft:#f7dfe5;
  --plum:#6b4c9a; --plum-soft:#e7def3;
  --good:#2f7d3a; --bad:#b4432f; --line:#d3dcc9;
  --f-ar:"Noto Naskh Arabic","Geeza Pro","Segoe UI","Tahoma",sans-serif;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a12; --surface:#1e261b; --ink:#e7eee0; --muted:#a3b39a;
  --olive:#9cc06a; --olive-soft:#2b3a22; --sky:#7cb9e4; --sky-soft:#1d3142;
  --sun:#f0c060; --sun-soft:#3a3018; --rose:#ef8fa6; --rose-soft:#3d2229;
  --plum:#b9a0e0; --plum-soft:#2c2340;
  --good:#7fcf88; --bad:#f08a76; --line:#33402d; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.55}
html[dir="rtl"] body{font-family:var(--f-ar)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:44px;height:44px;border-radius:50%;background:var(--olive);display:grid;place-items:center;flex:none}
.mark svg{width:26px;height:26px}
h1{font-size:1.35rem;margin:0;line-height:1.2}
.badge{font-size:.72rem;letter-spacing:.04em;color:var(--muted)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font:inherit;font-size:.95rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--olive);color:var(--surface)}
button{font:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hello{background:var(--sun-soft);border-radius:18px;padding:16px 18px}
.hello p{margin:0}
.hello .big{font-size:1.3rem;font-weight:700;margin-bottom:4px;text-wrap:balance}
.stars{display:flex;align-items:center;gap:8px;font-weight:700}
.stars span{color:var(--sun);font-size:1.3rem}
h2{font-size:1.1rem;margin:0}
h3{font-size:1rem;margin:0;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border:0;border-radius:18px;padding:14px 16px;min-height:118px;text-align:start;cursor:pointer;color:var(--ink);
  display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile .glyph{font-size:1.9rem;font-weight:700;line-height:1}
.tile b{font-size:1.02rem}
.tile small{color:var(--muted);font-size:.84rem}
.c-olive{background:var(--olive-soft)} .c-olive .glyph{color:var(--olive)}
.c-sky{background:var(--sky-soft)} .c-sky .glyph{color:var(--sky)}
.c-sun{background:var(--sun-soft)} .c-sun .glyph{color:var(--sun)}
.c-rose{background:var(--rose-soft)} .c-rose .glyph{color:var(--rose)}
.c-plum{background:var(--plum-soft)} .c-plum .glyph{color:var(--plum)}
.c-plain{background:var(--surface);border:1.5px solid var(--line)} .c-plain .glyph{color:var(--olive)}
.panel{background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px;border:1.5px solid var(--line)}
.back{align-self:flex-start;border:0;background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--olive);border-color:var(--olive);color:var(--surface)}
.btn{border:0;border-radius:999px;background:var(--sky);color:#fff;padding:10px 20px;cursor:pointer;align-self:center}
.btn.alt{background:var(--olive)}
.hint{text-align:center;margin:0;color:var(--muted);text-wrap:balance}
.center{text-align:center;margin:0;text-wrap:balance}
/* Arabic letters */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;direction:rtl}
.letters button{font-family:var(--f-ar);font-size:1.6rem;padding:8px 0;border:0;border-radius:12px;background:var(--olive-soft);color:var(--ink);cursor:pointer}
.letters button[aria-pressed="true"]{background:var(--olive);color:var(--surface)}
.show{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.show .huge{font-family:var(--f-ar);font-size:5rem;line-height:1.1;color:var(--olive)}
.show .word{font-family:var(--f-ar);font-size:1.8rem}
.show .pic{font-size:3rem;line-height:1}
/* Maths */
.q{font-size:2.6rem;font-weight:700;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choices button{font-size:1.8rem;font-weight:700;padding:14px 0;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.choices button.ok{border-color:var(--good);color:var(--good)}
.choices button.no{border-color:var(--bad);color:var(--bad)}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;direction:ltr;min-height:28px}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--sky);display:block}
.dots i.b{background:var(--sun)}
.msg{text-align:center;min-height:1.6em;font-weight:700}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)}
/* Word cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.card{border:0;border-radius:14px;background:var(--sun-soft);padding:12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.card .pic{font-size:2.2rem;line-height:1.2}
.card .sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line)}
.card .en{font-size:1.12rem;font-weight:700;direction:ltr}
.card .ar{font-family:var(--f-ar);color:var(--muted)}
/* Songs and stories */
.lyrics{background:var(--bg);border-radius:14px;padding:14px 16px;margin:0;white-space:pre-line;line-height:1.9;font-size:1.08rem}
.lyrics.en{direction:ltr;text-align:left}
.lyrics.ar{direction:rtl;text-align:right;font-family:var(--f-ar)}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:0;border-radius:14px;background:var(--bg);padding:12px 14px;text-align:start;cursor:pointer;color:var(--ink);display:flex;gap:12px;align-items:center}
.item .em{font-size:1.8rem}
/* Drawing and colouring */
.pad{width:100%;aspect-ratio:1/1;background:#fff;border-radius:14px;border:2px solid var(--line);touch-action:none;display:block}
.colors{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.colors button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.colors button[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.12)}
.colorsvg{width:100%;background:#fff;border-radius:14px;border:2px solid var(--line);display:block}
.colorsvg .f{cursor:pointer}
.steps{width:100%;max-width:340px;align-self:center;background:#fff;border-radius:14px;border:2px solid var(--line);display:block}
/* Games */
.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memory button{aspect-ratio:1/1;border:0;border-radius:12px;font-size:2rem;cursor:pointer;background:var(--plum);color:transparent}
.memory button.up,.memory button.done{background:var(--plum-soft);color:inherit}
.memory button.done{opacity:.55}
.shapes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shapes button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:10px;cursor:pointer}
.shapes button.ok{border-color:var(--good)} .shapes button.no{border-color:var(--bad)}
.shapes svg{width:100%;height:90px;display:block}
/* Calm */
.breath{display:grid;place-items:center;height:240px}
.circle{width:110px;height:110px;border-radius:50%;background:var(--olive-soft);border:3px solid var(--olive);display:grid;place-items:center;font-weight:700;color:var(--olive);animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.8)}}
@media (prefers-reduced-motion:reduce){.circle{animation:none}}
.ground{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ground li{background:var(--bg);border-radius:12px;padding:10px 14px}
.ground b{color:var(--olive);font-size:1.2rem}
textarea{width:100%;min-height:150px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:12px;font:inherit;resize:vertical}
footer{font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1.5px solid var(--line);padding-top:16px}
footer p{margin:0}
footer strong{color:var(--ink)}
</style>

var AC=null,tuneTimer=null,playing=-1;
function freq(n){var m={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[n[0]],o=+n[n.length-1];return 440*Math.pow(2,(m+12*(o+1)-69)/12)}
function stopTune(){playing=-1;if(tuneTimer){clearTimeout(tuneTimer);tuneTimer=null}if(AC){try{AC.close()}catch(e){}AC=null}}
function playTune(i){stopTune();var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;AC=new Ctx();playing=i;
 var beat=.42,tm=AC.currentTime+.1;
 SONGS[i].tune.split(" ").forEach(function(tok){var p=tok.split(":"),d=(p[1]?+p[1]:1)*beat,o=AC.createOscillator(),g=AC.createGain();
  o.type="triangle";o.frequency.value=freq(p[0]);g.gain.setValueAtTime(0,tm);g.gain.linearRampToValueAtTime(.22,tm+.02);g.gain.exponentialRampToValueAtTime(.001,tm+d*.95);
  o.connect(g);g.connect(AC.destination);o.start(tm);o.stop(tm+d);tm+=d});
 tuneTimer=setTimeout(function(){stopTune();render()},(tm-AC.currentTime)*1000+200)}

 return panel(t("s_en"),pills("enCat",ENORDER.map(function(k){return [k,L2(EN[k])]}))+
 '<p class="hint">'+t("tapWord")+'</p><div class="cards">'+
 g.w.map(function(w){var pic=w[0].charAt(0)==="#"?'<span class="sw" style="background:'+w[0]+'"></span>':'<span class="pic" aria-hidden="true">'+w[0]+'</span>';
  return '<button class="card" data-say="'+esc(w[1].replace("…",""))+'" data-sl="en-GB">'+pic+'<span class="en">'+esc(w[1])+'</span><span class="ar" lang="ar">'+w[2]+'</span></button>'}).join("")+'</div>')}

function songs(){
 if(S.song<0)return panel(t("s_song"),'<p class="hint">'+t("singAlong")+'</p><div class="list">'+SONGS.map(function(s,i){return '<button class="item" data-song="'+i+'"><span class="em" aria-hidden="true">'+s.em+'</span><b>'+L2(s)+'</b></button>'}).join("")+'</div>');
 var s=SONGS[S.song],on=playing===S.song;
 return panel(s.em+" "+L2(s),'<button class="btn '+(on?"alt":"")+'" data-tune="'+S.song+'">'+(on?"■ "+t("stop"):"▶ "+t("playTune"))+'</button>'+
 '<p class="lyrics '+S.lang+'">'+esc(S.lang==="ar"?s.lar:s.len)+'</p>'+
 '<p class="lyrics '+(S.lang==="ar"?"en":"ar")+'" style="opacity:.75;font-size:.95rem">'+esc(S.lang==="ar"?s.len:s.lar)+'</p>'+
 '<button class="pill" data-song="-1">'+t("s_song")+'</button>')}

function stories(){
 if(S.story<0)return panel(t("s_story"),'<div class="list">'+STORIES.map(function(s,i){return '<button class="item" data-story="'+i+'"><span class="em" aria-hidden="true">'+s.em+'</span><b>'+L2(s)+'</b></button>'}).join("")+'</div>');
 var s=STORIES[S.story],txt=S.lang==="ar"?s.tar:s.ten;
 return panel(s.em+" "+L2(s),(canSpeak?'<button class="btn" data-say="'+esc(txt)+'" data-sl="'+(S.lang==="ar"?"ar":"en-GB")+'">'+t("listen")+'</button>':'')+
 '<p class="lyrics '+S.lang+'">'+esc(txt)+'</p><button class="pill" data-story="-1">'+t("s_story")+'</button>')}

function drawing(){
 var top=pills("drawMode",[["free",t("freeDraw")],["steps",t("drawSteps")]]);
 if(S.drawMode==="free")return panel(t("s_draw"),top+palette()+'<canvas class="pad" id="pad" width="800" height="800"></canvas>'+
  '<div class="row" style="justify-content:center"><button class="pill" data-colour="#ffffff">'+t("eraser")+'</button><button class="pill" data-clear="1">'+t("clear")+'</button><button class="pill" data-savepng="1">'+t("save")+'</button></div>');
 if(S.drawIdx<0)return panel(t("s_draw"),top+'<div class="list">'+DRAWS.map(function(d,i){return '<button class="item" data-drawidx="'+i+'"><span class="em" aria-hidden="true">'+d.em+'</span><b>'+L2(d)+'</b></button>'}).join("")+'</div>');
 var d=DRAWS[S.drawIdx],n=S.drawStep,parts="";
 for(var i=0;i<=n;i++)parts+='<g fill="none" stroke="'+(i===n?"#e2552f":"#222")+'" stroke-width="'+(i===n?6:4)+'" stroke-linecap="round" stroke-linejoin="round">'+d.s[i]+'</g>';
 var last=n>=d.s.length-1;
 return panel(d.em+" "+L2(d),top+'<p class="center"><b>'+t("step")+' '+num(n+1)+' '+t("of")+' '+num(d.s.length)+'</b></p><svg class="steps" viewBox="0 0 300 300" aria-hidden="true">'+parts+'</svg>'+
 '<div class="row" style="justify-content:center">'+(last?'<button class="btn alt" data-dstep="0">'+t("again")+'</button>':'<button class="btn" data-dstep="'+(n+1)+'">'+t("next")+' →</button>')+'<button class="pill" data-drawidx="-1">'+t("drawSteps")+'</button></div>')}

function colouring(){
 if(S.page<0)return panel(t("s_col"),'<div class="cards">'+PAGES.map(function(p,i){return '<button class="card" data-page="'+i+'"><span class="pic" aria-hidden="true">'+p.em+'</span><span class="en" style="direction:inherit">'+L2(p)+'</span></button>'}).join("")+'</div>');
 var p=PAGES[S.page],saved=load("zs_col_"+S.page,null);
 return panel(p.em+" "+L2(p),'<p class="hint">'+t("tapColour")+'</p>'+palette()+
 '<svg class="colorsvg" id="csvg" viewBox="0 0 300 300" role="img" aria-label="'+esc(L2(p))+'">'+p.svg+'</svg>'+
 '<div class="row" style="justify-content:center"><button class="pill" data-cclear="1">'+t("clear")+'</button><button class="pill" data-page="-1">'+t("s_col")+'</button></div>')}

function newMem(){var e=shuffle(["🫒","🍊","🐟","🌙","⭐","🦋","🍉","🐢"]).slice(0,6);S.mem={cards:shuffle(e.concat(e)).map(function(x){return {e:x,up:false,done:false}}),open:[],won:false}}
function newShape(){var useCol=Math.random()<.4;
 if(useCol){var cols=shuffle(SCOLS.slice()),sh=SHAPES[Math.floor(Math.random()*SHAPES.length)];S.shape={kind:"col",target:cols[0],opts:shuffle(cols.map(function(c){return {c:c[0],s:sh[2],k:c[0]}})),ans:cols[0][0],picked:null}}
 else{var shs=shuffle(SHAPES.slice()).slice(0,4);S.shape={kind:"shape",target:shs[0],opts:shuffle(shs.map(function(s){return {c:"#2a73a8",s:s[2],k:s[0]}})),ans:shs[0][0],picked:null}}}
function games(){
 var top=pills("game",[["memory",t("memory")],["shapes",t("shapes")]]);
 if(S.game==="memory"){if(!S.mem)newMem();var m=S.mem;
  return panel(t("s_game"),top+'<p class="hint">'+(m.won?'<b style="color:var(--good)">'+t("memWin")+'</b>':t("memHint"))+'</p><div class="memory">'+
  m.cards.map(function(c,i){return '<button class="'+(c.done?"done":c.up?"up":"")+'" data-mem="'+i+'" aria-label="'+(c.up||c.done?c.e:"?")+'">'+c.e+'</button>'}).join("")+'</div>'+
  (m.won?'<button class="btn" data-newmem="1">'+t("again")+'</button>':''))}
 if(!S.shape)newShape();var s=S.shape,label=s.kind==="col"?L2(s.target[1]):L2(s.target[1]);
 return panel(t("s_game"),top+'<p class="center" style="font-size:1.3rem"><b>'+t("tapThe")+' '+label+'</b></p><div class="shapes">'+
 s.opts.map(function(o){var cl=s.picked===o.k?(o.k===s.ans?"ok":"no"):"";return '<button class="'+cl+'" data-shape="'+o.k+'"><svg viewBox="0 0 100 100" fill="'+o.c+'">'+o.s+'</svg></button>'}).join("")+'</div>'+
 '<div class="msg '+(s.picked?(s.picked===s.ans?"ok":"no"):"")+'" role="status">'+(s.picked?(s.picked===s.ans?t("ok"):t("no")):"")+'</div>'+
 (s.picked===s.ans?'<button class="btn" data-newshape="1">'+t("next")+'</button>':''))}

function calm(){
 var top=pills("calm",[["breathe",t("breathe")],["ground",t("ground")]]);
 if(S.calm==="ground")return panel(t("s_calm"),top+'<p class="center">'+t("groundHint")+'</p><ul class="ground">'+
  [[5,"g5"],[4,"g4"],[3,"g3"],[2,"g2"],[1,"g1"]].map(function(g){return '<li><b>'+num(g[0])+'</b> '+t(g[1])+'</li>'}).join("")+'</ul><p class="center">'+t("calm1")+'</p>');
 return panel(t("s_calm"),top+'<p class="center">'+t("calm1")+'</p><div class="breath"><div class="circle">'+t("in_")+'</div></div><p class="center">'+t("calm2")+'</p>')}

function newT(){var a=2+Math.floor(Math.random()*9),b=2+Math.floor(Math.random()*9),ans=a*b,set=[ans];
 while(set.length<3){var c=ans+(Math.floor(Math.random()*5)-2)*(Math.random()<.5?a:1);if(c>0&&set.indexOf(c)<0)set.push(c)}
 S.tq={a:a,b:b,ans:ans,opts:shuffle(set),state:null,picked:null}}
function teen(){
 var top=pills("teen",[["journal",t("journal")],["times",t("times")],["ground",t("ground")]]);
 if(S.teen==="times"){if(!S.tq)newT();var q=S.tq;
  return panel(t("s_teen"),top+'<div class="q">'+num(q.a)+' × '+num(q.b)+' = ?</div>'+choices(q).replace(/data-ans/g,"data-tans").replace(/data-next/g,"data-tnext"))}
 if(S.teen==="ground"){S.calm="ground";return calm().replace(t("s_calm"),t("s_teen"))}
 var P=PROMPTS[S.lang],p=P[S.prompt%P.length];
 return panel(t("s_teen"),top+'<p class="hint">'+t("jHint")+'</p><p class="lyrics '+S.lang+'" style="font-weight:700">'+esc(p)+'</p>'+
 '<button class="pill" data-prompt="1" style="align-self:center">'+t("newPrompt")+'</button><textarea id="journal" aria-label="'+t("journal")+'">'+esc(load("zs_journal",""))+'</textarea><p class="hint" id="jsaved" role="status"></p>')}

/* ---------- canvas drawing ---------- */
function setupPad(){var c=document.getElementById("pad");if(!c)return;var x=c.getContext("2d"),down=false,last=null;
 function bg(){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);var tr=c.dataset.trace;
  if(tr){x.fillStyle="#d8e3cc";x.textAlign="center";x.textBaseline="middle";x.font="420px "+getComputedStyle(document.body).fontFamily;x.fillText(tr,c.width/2,c.height/2+20)}}
 var tr=c.dataset.trace;
 bg();
 if(!tr){var img=load("zs_draw",null);if(img){var im=new Image();im.onload=function(){x.drawImage(im,0,0)};im.src=img}}
 function pos(e){var r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
 c.onpointerdown=function(e){down=true;last=pos(e);c.setPointerCapture(e.pointerId);dot(last)};
 c.onpointermove=function(e){if(!down)return;var p=pos(e);x.strokeStyle=tr?"#2a73a8":S.colour;x.lineWidth=tr?34:(S.colour==="#ffffff"?40:14);x.lineCap="round";x.lineJoin="round";x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p};
 c.onpointerup=c.onpointercancel=function(){if(!down)return;down=false;if(!tr){try{save("zs_draw",c.toDataURL("image/png"))}catch(e){}}};
 function dot(p){x.fillStyle=tr?"#2a73a8":S.colour;x.beginPath();x.arc(p.x,p.y,tr?17:(S.colour==="#ffffff"?20:7),0,7);x.fill()}
 c._clear=function(){bg();if(!tr)save("zs_draw",null)}}

function setupColour(){var s=document.getElementById("csvg");if(!s)return;var saved=load("zs_col_"+S.page,{}),fs=s.querySelectorAll(".f");
 fs.forEach(function(el,i){if(saved[i])el.style.fill=saved[i];el.addEventListener("click",function(){el.style.fill=S.colour;saved[i]=S.colour;save("zs_col_"+S.page,saved)})})}

function setupJournal(){var j=document.getElementById("journal");if(!j)return;var tm;
 j.addEventListener("input",function(){clearTimeout(tm);tm=setTimeout(function(){save("zs_journal",j.value);var s=document.getElementById("jsaved");if(s)s.textContent=t("saved")},400)})}

/* ---------- render and events ---------- */
var VIEWS={home:home,ar:arabic,math:maths,en:english,song:songs,story:stories,draw:drawing,colour:colouring,game:games,calm:calm,teen:teen};
function render(){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
 app.innerHTML=header()+(VIEWS[S.view]||home)()+footer();
 setupPad();setupColour();setupJournal()}

app.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
 if(d.lang){S.lang=d.lang;save("zs_lang",S.lang);render();return}
 if(d.go){if(canSpeak)speechSynthesis.cancel();stopTune();S.view=d.go;S.song=-1;S.story=-1;S.page=-1;S.drawIdx=-1;if(d.go==="math")newQ();render();window.scrollTo(0,0);return}
 if(d.set){S[d.set]=d.val;if(d.set==="teen"&&d.val==="times")newT();render();return}
 if(d.letter){S.letter=+d.letter;render();var L=LETTERS[S.letter];speak(L[0]+"، "+L[1],"ar");return}
 if(d.say){speak(d.say,d.sl);return}
 if(d.ans!==undefined&&S.q&&S.q.state!=="ok"){var o=+d.ans;S.q.picked=o;if(o===S.q.ans){S.q.state="ok";star()}else S.q.state="no";render();return}
 if(d.next){newQ();render();return}
 if(d.tans!==undefined&&S.tq&&S.tq.state!=="ok"){var o2=+d.tans;S.tq.picked=o2;if(o2===S.tq.ans){S.tq.state="ok";star()}else S.tq.state="no";render();return}
 if(d.tnext){newT();render();return}
 if(d.song!==undefined){stopTune();S.song=+d.song;render();window.scrollTo(0,0);return}
 if(d.tune!==undefined){if(playing===+d.tune)stopTune();else playTune(+d.tune);render();return}
 if(d.story!==undefined){if(canSpeak)speechSynthesis.cancel();S.story=+d.story;render();window.scrollTo(0,0);return}
 if(d.colour){S.colour=d.colour;app.querySelectorAll("[data-colour]").forEach(function(x){if(x.closest(".colors"))x.setAttribute("aria-pressed",x.dataset.colour===S.colour)});return}
 if(d.clear){var c=document.getElementById("pad");if(c&&c._clear)c._clear();return}
 if(d.savepng){var c2=document.getElementById("pad");if(c2){var a=document.createElement("a");a.href=c2.toDataURL("image/png");a.download="zaytoun-drawing.png";a.click()}return}
 if(d.drawidx!==undefined){S.drawIdx=+d.drawidx;S.drawStep=0;render();return}
 if(d.dstep!==undefined){S.drawStep=+d.dstep;if(S.drawStep===DRAWS[S.drawIdx].s.length-1)star();render();return}
 if(d.page!==undefined){S.page=+d.page;render();window.scrollTo(0,0);return}
 if(d.cclear){save("zs_col_"+S.page,{});render();return}
 if(d.mem!==undefined){var m=S.mem,i=+d.mem,cd=m.cards[i];if(cd.up||cd.done||m.open.length>=2)return;cd.up=true;m.open.push(i);
  if(m.open.length===2){var A=m.cards[m.open[0]],B=m.cards[m.open[1]];
   if(A.e===B.e){A.done=B.done=true;A.up=B.up=false;m.open=[];if(m.cards.every(function(x){return x.done})){m.won=true;star()}render()}
   else{render();setTimeout(function(){A.up=B.up=false;m.open=[];render()},900)}}else render();return}
 if(d.newmem){newMem();render();return}
 if(d.shape){if(S.shape.picked===S.shape.ans)return;S.shape.picked=d.shape;if(d.shape===S.shape.ans)star();render();return}
 if(d.newshape){newShape();render();return}
 if(d.prompt){S.prompt++;render();return}
});
render();
})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){navigator.serviceWorker.register("/school-sw.js",{scope:"/school"}).catch(function(){})}
</script>
